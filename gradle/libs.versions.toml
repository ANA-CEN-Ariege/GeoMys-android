[versions]
agp = "9.1.1"
coreKtx = "1.19.0"
junit = "4.13.2"
appcompat = "1.8.0"
# NB avertissement console Play « API obsolètes bord à bord » (Window.setStatusBarColor /
# setNavigationBarColor dans BottomSheetDialog / EdgeToEdgeUtils / SheetDialog) : ces appels
# sont du code de COMPATIBILITÉ gardé par version (< API 35) DANS Material — indispensables
# pour les Android < 15 (minSdk 24). Vérifié au dexdump : présents à l'identique en 1.13.0 et
# 1.14.0 — aucune version ne fait disparaître l'avertissement, qui est INFORMATIF et non
# bloquant. Notre code n'appelle pas ces API. Inutile de monter de version pour ça.
material = "1.12.0"
osmdroid = "6.1.20"
coroutines = "1.8.1"
lifecycle = "2.11.0"
gson = "2.11.0"
navigation = "2.9.8"
fragmentKtx = "1.9.0"
activityKtx = "1.13.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
osmdroid = { group = "org.osmdroid", name = "osmdroid-android", version.ref = "osmdroid" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }
fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragmentKtx" }
activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
